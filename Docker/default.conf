server {
    listen 8080 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;
    charset utf-8;

    client_max_body_size 2048M;

    # Bloquear acceso directo a directorios y archivos internos
    location ~* ^/(core|cache|content|cli|Docker)(/|$) {
        deny all;
        return 404;
    }
    location ~* ^/(config\.json|\.installed|release\.sh)$ {
        deny all;
        return 404;
    }
    location ~* ^/plugins/.*\.json$ {
        deny all;
        return 404;
    }
    location ~* \.(db|sqlite|sqlite3|log)$ {
        deny all;
        return 404;
    }
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Media: imágenes, audio y vídeo (sin ejecutar PHP)
    location ^~ /media/ {
        access_log off;
        location ~* \.php$ { deny all; return 404; }
        try_files $uri =404;

        location ~* \.(jpg|jpeg|png|gif|webp|svg|avif|ico)$ {
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~* \.(mp3|ogg|oga|wav|m4a|flac|aac|weba|mp4|m4v|webm|ogv|mov)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header Accept-Ranges bytes;
        }
    }

    # Panel de administración
    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.php?$query_string;
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 180;
        }
    }

    # Instalador
    location ^~ /install/ {
        try_files $uri $uri/ /install/index.php?$query_string;
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    # Assets estáticos
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|otf|svg|eot|webp|avif)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php?$uri&$args;
    }

    # Router principal de KutBlog
    location / {
        try_files $uri $uri/ /index.php?$uri&$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 180;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
