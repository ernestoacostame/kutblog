services:
  kutblog:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: kutblog
    ports:
      - "${KUTBLOG_PORT:-8080}:8080"
    volumes:
      - kutblog_data:/data
    environment:
      TZ: "${TZ:-UTC}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  kutblog_data:
    driver: local
